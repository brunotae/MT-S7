<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MT-S7</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MT-S7">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0d12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0a0d12;--s1:#11161f;--s2:#171d29;--s3:#1e2533;--line:#252c39;--red:#d8232a;--red2:#ff4047;--tx:#f2f3f5;--mut:#9aa0ab;--dim:#646a75;--ok:#3ecf8e;--warn:#f5b041}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,sans-serif;font-size:15px}
[hidden]{display:none!important}
body{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.glow{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.glow i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.22}
.glow i:nth-child(1){width:60vw;height:60vw;max-width:420px;max-height:420px;background:#d8232a;top:-18vw;right:-20vw}
.glow i:nth-child(2){width:50vw;height:50vw;max-width:360px;max-height:360px;background:#5a0f14;bottom:-10vw;left:-20vw;opacity:.35}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.eyebrow{font-size:10px;letter-spacing:.3em;font-weight:500;color:var(--mut);text-transform:uppercase}
.brand{font-size:34px;font-weight:900;line-height:1;letter-spacing:-.01em;cursor:pointer}
.brand span{color:transparent;-webkit-text-stroke:1.5px var(--red)}
header img{width:58px;height:58px;object-fit:contain}
h2{font-size:20px;font-weight:700;margin:4px 0 12px}
.sec{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.sec b{font-size:11px;letter-spacing:.22em;font-weight:700;text-transform:uppercase;white-space:nowrap}
.sec i{flex:1;height:1px;background:var(--line)}
.sec small{font-size:11px;color:var(--dim)}
.card{background:linear-gradient(160deg,rgba(23,29,41,.92),rgba(17,22,31,.92));border:1px solid var(--line);border-radius:18px;padding:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lbl{font-size:10px;letter-spacing:.22em;font-weight:700;color:var(--red);text-transform:uppercase}
.mut{color:var(--mut)} .dim{color:var(--dim)} .small{font-size:12px} .ok{color:var(--ok)} .warn{color:var(--warn)} .redt{color:var(--red2)}
.right{text-align:right}
/* home */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.strip .card{padding:10px 12px}
.strip b{display:block;font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigbtn{border:1px solid var(--line);border-radius:22px;padding:18px 16px;min-height:128px;text-align:left;color:var(--tx);font-family:inherit;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,#1a2130,#11161f);cursor:pointer}
.bigbtn.red{background:linear-gradient(160deg,#e3262e,#9d1419);border-color:#e3262e}
.bigbtn .ic{font-size:26px;line-height:1}
.bigbtn b{font-size:17px;font-weight:700;line-height:1.15;display:block}
.bigbtn small{font-size:11.5px;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{border:1px solid var(--line);background:var(--s1);color:var(--tx);border-radius:999px;padding:10px 15px;font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;min-height:44px}
/* forms */
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.back{border:1px solid var(--line);background:var(--s1);color:var(--tx);border-radius:999px;padding:8px 14px;font-family:inherit;font-size:13px;cursor:pointer;min-height:40px}
.f{margin:12px 0}
.f>label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px;font-weight:500}
input,select,textarea{width:100%;background:var(--s1);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font-family:inherit;font-size:16px;min-height:46px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red)}
textarea{min-height:70px;resize:vertical}
input[type=date]{color-scheme:dark;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.85;cursor:pointer}
.banner{border-color:#6b1a1e;background:linear-gradient(160deg,#2a1115,#151a24);margin-bottom:14px}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--s1);color:var(--tx);border-radius:999px;padding:10px 16px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;min-height:44px}
.pill.on{background:var(--red);border-color:var(--red);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cot{background:var(--s2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.6}
.cot b{color:var(--tx)}
.linkbtn{background:none;border:none;color:var(--red2);font-family:inherit;font-size:12.5px;cursor:pointer;padding:4px 0;text-decoration:underline}
.items .it{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.items .g{display:grid;grid-template-columns:70px 1fr 74px;gap:8px;margin-top:8px}
.items .g.v{grid-template-columns:62px 1fr 64px}
.items .g input{padding:10px 8px;font-size:15px}
.items .rm{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;float:right;padding:4px}
.items .sub{font-size:12px;color:var(--mut);margin-top:6px;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 2px;border-top:1px solid var(--line);margin-top:6px}
.total b{font-size:22px;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{border:none;border-radius:999px;padding:13px 22px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;min-height:48px;color:#fff;background:var(--red)}
.btn.ghost{background:var(--s1);border:1px solid var(--line);color:var(--tx)}
.btn.danger{background:transparent;border:1px solid #5a1d20;color:#ff6b70}
.btn.danger.armed{background:#7a1418;color:#fff;border-color:#7a1418}
.btn:disabled{opacity:.5}
.err{color:#ff7a7f;font-size:13px;margin-top:10px}
/* lists */
.item{display:block;width:100%;text-align:left;font-family:inherit;color:var(--tx);cursor:pointer;margin-bottom:8px}
.item .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .l1 b{font-weight:600;font-size:14.5px}
.item .l2{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mut);margin-top:4px}
.tag{white-space:nowrap;display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.06em;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--mut);text-transform:uppercase}
.tag.ok{color:var(--ok);border-color:#1f5b44}.tag.warn{color:var(--warn);border-color:#5e4517}.tag.x{color:#ff7a7f;border-color:#5a1d20}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--mut)} .kv dd{text-align:right;font-weight:500}
.kv .tt{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-weight:700;color:var(--tx)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nums .card b{display:block;font-size:19px;font-weight:700;margin-top:4px}
.nums .card.hl{border-color:#6b1a1e;background:linear-gradient(160deg,#2a1115,#151a24)}
.empty{color:var(--dim);font-size:13.5px;text-align:center;padding:24px 8px}
.foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.login{max-width:380px;margin:8vh auto 0}
.vitems .vit{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.vitems .vit:first-child{border-top:none;padding-top:0}
.addit{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.row3{display:grid;grid-template-columns:70px 1fr 74px;gap:8px;margin-top:8px}.row3 input{padding:10px 8px;font-size:15px}
.filebtn{display:inline-flex;align-items:center;gap:6px;border:1px dashed #4a5263;background:var(--s1);color:var(--tx);border-radius:999px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;min-height:44px;margin-top:10px}
.filebtn:hover{border-color:var(--red)}
.anx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.anx:first-child{border-top:none}
.anxo{background:none;border:none;color:var(--tx);font-family:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;font-size:13.5px;font-weight:600}
.anxo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.anxo small{font-weight:400;font-size:11.5px;color:var(--mut)}
.ntxt{white-space:pre-wrap;font-size:12.5px;color:var(--mut);margin-top:6px;font-family:ui-monospace,Menlo,monospace;line-height:1.5;overflow-wrap:anywhere}
#drop{position:fixed;inset:10px;z-index:20;border:3px dashed var(--red);border-radius:24px;background:rgba(10,13,18,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;pointer-events:none}
#drop>div{text-align:center}#drop span{display:block;font-size:54px}#drop b{display:block;font-size:24px;margin-top:8px}#drop small{display:block;color:var(--mut);margin-top:6px;font-size:14px}
#drop.no{border-color:#5d636e}
.rv{display:flex;gap:8px;margin-top:10px;align-items:center}.rv select{flex:1;min-width:0}.rv .btn{min-height:46px;padding:10px 18px}
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:12mm 10mm}
  html,body{background:#fff!important;color:#111!important;font-size:10px}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;width:190mm;font-family:Poppins,Arial,sans-serif;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea .ph1{display:flex;align-items:center;gap:10px;background:#0a0d12;color:#fff;border-radius:8px;padding:8px 12px;margin-bottom:8px}
  #printArea .ph1 img{width:38px;height:38px}
  #printArea .ph1 b{display:block;font-size:15px}#printArea .ph1 span{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#d8232a}
  #printArea .pd{margin-left:auto;text-align:right;font-size:9px;color:#ccc}
  #printArea .pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:6px}
  #printArea .pk{border:1px solid #ddd;border-radius:6px;padding:5px 7px}
  #printArea .pk span{display:block;font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:#d8232a;font-weight:700}
  #printArea .pk b{display:block;font-size:12.5px;margin-top:1px}#printArea .pk small{font-size:7.5px;color:#666}
  #printArea .neg{color:#c0161d}
  #printArea h4{font-size:9px;letter-spacing:.16em;text-transform:uppercase;margin:8px 0 3px;border-bottom:1.5px solid #d8232a;padding-bottom:2px}
  #printArea .pt{width:100%;border-collapse:collapse;font-size:8.5px}
  #printArea .pt th{text-align:left;font-weight:600;color:#555;border-bottom:1px solid #ccc;padding:2px 3px}
  #printArea .pt td{border-bottom:1px solid #eee;padding:2.5px 3px;vertical-align:top}
  #printArea .pt .r{text-align:right;white-space:nowrap}
  #printArea .pt .tt td{font-weight:700;border-top:1px solid #999}
  #printArea .p2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  #printArea .pf{margin-top:8px;font-size:7.5px;color:#777;border-top:1px solid #ddd;padding-top:4px}
  #printArea,#printArea *{break-inside:avoid}
}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1e2533;border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:9;max-width:90vw}
@media (min-width:640px){.strip b{font-size:17px}.bigbtn{min-height:150px}}
/* ===== v5 dashboard ===== */
.app{position:relative;z-index:1}
aside{display:none}
.topbar{display:none}
.hero{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);background:radial-gradient(60% 90% at 82% 55%,#4a0f14 0%,#1d0c10 45%,transparent 75%),radial-gradient(90% 120% at 0% 0%,#2a0c10 0%,#120c10 40%,#0b0d12 75%);padding:22px 20px;min-height:170px;margin-bottom:12px}
.hero .ey{font-size:9.5px;letter-spacing:.32em;color:var(--mut);text-transform:uppercase;line-height:1.7}
.hero h1{font-size:28px;font-weight:900;line-height:1.02;margin:10px 0 8px;letter-spacing:-.01em;position:relative;z-index:2}
.hero h1 span{color:transparent;-webkit-text-stroke:1.4px var(--red)}
.hero .dash{width:34px;height:2px;background:var(--red);margin:10px 0}
.hero p{font-size:12.5px;color:var(--mut);max-width:62%;position:relative;z-index:2;line-height:1.55}
.heroimg{position:absolute;top:0;right:0;bottom:0;width:58%;z-index:1;pointer-events:none}
.heroimg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,11,15,.92) 0%,rgba(14,11,15,.55) 35%,rgba(14,11,15,0) 70%)}
.heroimg img{position:absolute;right:-6%;bottom:6%;height:86%;width:auto;object-fit:contain;opacity:1;filter:drop-shadow(0 14px 26px rgba(0,0,0,.65)) drop-shadow(0 0 30px rgba(216,35,42,.18))}
.hero .ring{display:none}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stage{background:linear-gradient(160deg,#151b26,#10141c);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;font-family:inherit;color:var(--tx);cursor:pointer;position:relative;overflow:hidden}
.stage .h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.stage b{display:block;font-size:30px;font-weight:300;line-height:1.1;margin-top:6px}
.stage small{font-size:11px;color:var(--mut)}
.stage::after{content:"";position:absolute;right:-20px;bottom:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(216,35,42,.18),transparent 70%)}
.panel{background:linear-gradient(160deg,rgba(23,29,41,.95),rgba(15,19,27,.95));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ph h3{font-size:16px;font-weight:700}
.ph a,.ph .lnk{font-size:12px;color:var(--mut);cursor:pointer;background:none;border:none;font-family:inherit}
.fpills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fpill{border:1px solid var(--line);background:var(--s1);color:var(--mut);border-radius:999px;padding:6px 12px;font-family:inherit;font-size:12px;cursor:pointer}
.fpill.on{background:var(--red);color:#fff;border-color:var(--red)}
.search{background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;min-height:40px;width:100%}
.jrow{display:block;width:100%;text-align:left;font-family:inherit;color:var(--tx);background:none;border:none;border-top:1px solid var(--line);padding:12px 2px;cursor:pointer}
.jrow:first-child{border-top:none}
.jc{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;background:linear-gradient(145deg,#2a3142,#1a1f2b);border:1px solid #333b4b;color:#fff}
.jc .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc .cd{font-size:11px;color:var(--dim)}
.steps{display:flex;align-items:flex-start;margin:12px 0 4px}
.st{flex:1;min-width:0;position:relative;text-align:center;font-size:9px;line-height:1.2;color:var(--dim);padding-top:17px}
.st::before{content:"";position:absolute;top:5px;left:-50%;right:50%;height:2px;background:#2a3140}
.st:first-child::before{display:none}
.st.done::before{background:var(--red)}
.st i{position:absolute;top:0;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#1b212c;border:2px solid #39414f;z-index:1}
.st.done i{background:var(--red);border-color:var(--red)}
.st.cur i{background:#0a0d12;border-color:var(--red);box-shadow:0 0 0 4px rgba(216,35,42,.22)}
.st.done,.st.cur{color:var(--tx)}
.st.pul i{background:#0a0d12;border-color:var(--warn);box-shadow:0 0 0 4px rgba(245,176,65,.18)}.st.pul{color:var(--warn);font-weight:700}
.st.pul::before{background:#2a3140}
.st.cur{font-weight:700}
.jmeta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mut);margin-top:6px}
.jmeta b{color:var(--tx);font-weight:600}
.acts .a{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.acts .a:first-child{border-top:none}
.acts .dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:6px;flex:none}
.acts .dot.y{background:var(--warn)}.acts .dot.g{background:var(--ok)}
.fx{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fx div{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px}
.fx b{display:block;font-size:17px;margin-top:2px}
.fin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
.fin .k{display:flex;gap:8px;align-items:flex-start}
.fin .ic2{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);font-size:12px;flex:none}
.fin small{font-size:11px;color:var(--mut);display:block}
.fin b{font-size:13.5px;white-space:nowrap}
.fin .k>div{min-width:0}
.tl .r .tag{white-space:nowrap;align-self:center;flex:none}
.tl .r{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;cursor:pointer}
.tl .r:first-child{border-top:none}
.tl .d{width:44px;flex:none;color:var(--dim);font-size:11px;line-height:1.3}
.tl .d b{display:block;color:var(--tx);font-size:15px;font-weight:600}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick button{border:1px solid var(--line);background:var(--s1);color:var(--tx);border-radius:14px;padding:12px 10px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;min-height:62px}
.quick button.r{background:linear-gradient(160deg,#e3262e,#9d1419);border-color:#e3262e}
.quick button span{display:block;font-size:18px;margin-bottom:2px}
.mobile-only{display:block}.desk-only{display:none}
@media (min-width:1024px){
  html,body{font-size:14px}
  .glow i:nth-child(1){right:5vw}
  .app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
  aside{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(13,17,24,.96),rgba(10,13,18,.96));padding:20px 12px}
  aside .lg{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:10px;cursor:pointer}
  aside .lg img{width:84px}
  aside .lg b{font-size:22px;font-weight:900;letter-spacing:.02em}
  aside .lg b span{color:transparent;-webkit-text-stroke:1.2px var(--red)}

<script>
/* ===== Config ===== */

 ["Kit básico S7 (main set ready-to-dive)","Conjunto CCR",4091.80,4990],

/* ===== Helpers ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
function num(v){
  if(v==null||v==="")return 0; if(typeof v==="number")return isFinite(v)?v:0;
  let s=String(v).trim().replace(/\s|R\$|US\$|€/g,"");
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  else if((s.match(/\./g)||[]).length>1) s=s.replace(/\./g,"");
  else if(/^\d{1,3}\.\d{3}$/.test(s)) s=s.replace(".","");
  const n=parseFloat(s); return isFinite(n)?n:0;
}
const r2=v=>Math.round((Number(v)||0)*100)/100;
const fmt=(v,m="BRL")=>SYM[m]+" "+(Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN=(v,d=2)=>(Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtIn=v=>v?fmtN(v):"";
const sum=(a,f)=>a.reduce((t,x)=>t+(Number(f(x))||0),0);
const dCurta=d=>d?new Date(d+"T12:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).replace(".",""):"";
const dLonga=d=>d?new Date(d+"T12:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}):"";
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2400)}

/* ===== State ===== */
let S={user:null,me:"Tae",rows:[],view:"home",param:null,hist:"todos"};

/* ===== Câmbio ===== */
const cotCache={};
async function fetchCot(date){
  if(cotCache[date])return cotCache[date];
  const d=date>today()?"latest":date;
  const urls=[`https://api.frankfurter.dev/v1/${d}?base=EUR&symbols=USD,BRL`,`https://api.frankfurter.app/${d}?from=EUR&to=USD,BRL`];
  for(const u of urls){
    try{const r=await fetch(u);if(!r.ok)continue;const j=await r.json();
      if(j.rates&&j.rates.BRL&&j.rates.USD){const c={EUR:j.rates.BRL,USD:j.rates.BRL/j.rates.USD,BRL:1,fonte:"BCE "+(j.date||d).split("-").reverse().join("/")};cotCache[date]=c;return c}
    }catch(e){}
  }
  return null;
}
const cotOk=c=>c&&c.EUR>0&&c.USD>0;
function conv(v,from,to,c){if(from===to)return v;if(!cotOk(c))return 0;const brl=v*(c[from]||0);return to==="BRL"?brl:brl/c[to]}
function cotTxt(c){
  if(!cotOk(c))return '<span class="warn">Sem cotação. Toque em “ajustar taxa” e informe.</span>';
  return `Taxa considerada${c.fonte?" ("+esc(c.fonte)+")":""}${c.manual?" · <b>ajustada à mão</b>":""}:<br><b>€ 1 = R$ ${fmtN(c.EUR,4)}</b> · <b>US$ 1 = R$ ${fmtN(c.USD,4)}</b> · € 1 = US$ ${fmtN(c.EUR/c.USD,4)}`;
}

/* ===== Cálculos ===== */
const itemTot=it=>num(it.qtd)*num(it.preco)*(1-num(it.desc)/100);
const itensTot=a=>sum(a||[],itemTot);
const compraTotal=c=>itensTot(D(c).itens)+num(D(c).frete)+num(D(c).iva);
const pagsDe=c=>act("pagamento").filter(p=>D(p).compra_id===c.id);
const compraPago=c=>sum(pagsDe(c),p=>D(p).valor_eur);
const compraSaldo=c=>r2(compraTotal(c)-compraPago(c));
const compraBRL=c=>sum(pagsDe(c),p=>D(p).valor_brl)+Math.max(0,compraSaldo(c))*(D(c).cot?.EUR||0);
const vendaTotal=v=>itensTot(D(v).itens);
const recsDe=v=>act("recebimento").filter(x=>D(x).venda_id===v.id);
const vendaRecebido=v=>sum(recsDe(v),x=>D(x).valor_venda);
const vendaSaldo=v=>r2(vendaTotal(v)-vendaRecebido(v));
const vendaBRL=v=>sum(recsDe(v),x=>D(x).valor_brl)+Math.max(0,vendaSaldo(v))*(D(v).cot?.[D(v).moeda]||0);
const isRes=v=>D(v).etapa==="Reserva";
const comprasDe=v=>act("compra").filter(c=>D(c).venda_id===v.id);
const custosDe=v=>act("custo").filter(c=>D(c).venda_id===v.id);
function vendaCusto(v){
  const cs=comprasDe(v);
  if(cs.length)return{v:sum(cs,compraBRL),est:false};
  const c=D(v).cot;let eur=0;
  (D(v).itens||[]).forEach(it=>{const p=byId(it.produto_id);eur+=num(it.qtd)*num(D(p).dealer)});
  return{v:eur*(c?.EUR||0),est:true};
}
function vendaLucro(v){const rec=vendaBRL(v),c=vendaCusto(v),ct=sum(custosDe(v),x=>D(x).valor_brl);const l=rec-c.v-ct;return{rec,custo:c.v,est:c.est,custos:ct,lucro:l,pct:rec?l/rec:0}}
const cliNome=id=>{const c=byId(id);return c?`${D(c).numero} · ${D(c).nome}`:"—"};
const prodNome=id=>D(byId(id)).nome||"(produto)";
const itNome=it=>it.produto_id?((pCod(byId(it.produto_id))?pCod(byId(it.produto_id))+" · ":"")+prodNome(it.produto_id)):(it.nome||"(produto)");
function nextNum(tipo,pref){const n=Math.max(0,...S.rows.filter(r=>r.tipo===tipo).map(r=>parseInt(String(D(r).numero||"").replace(/\D/g,""))||0))+1;return pref+String(n).padStart(3,"0")}

/* ===== Dados ===== */
async function load(){
  const {data,error}=await sb.from(T).select("*").order("data",{ascending:false}).order("created_at",{ascending:false});
  if(error){console.error(error);toast("Erro ao carregar: "+error.message);return false}

}

  const rows=CATALOGO.map(([codigo,nome,tipo,dealer,varejo,nome_en,ref])=>({tipo:"produto",data:today(),dados:{codigo,nome,tipo,dealer,varejo,nome_en,ref}}));

  await load();
}

  if(id){const {error}=await sb.from(T).update({data,dados,updated_at:new Date().toISOString()}).eq("id",id);if(error)throw error;return id}

/* ===== Navegação ===== */
function go(view,param=null){S.view=view;S.param=param;F=null;render();window.scrollTo(0,0)}
const backTo=v=>`<div class="top"><button class="back" onclick="go('${v}')">← ${v==="home"?"Início":"Voltar"}</button></div>`;

/* ===== Login ===== */
function viewLogin(){return `<div class="login card">
  <div class="lbl">Entrar</div><h2>Acesse o MT-S7</h2>
  <div class="f"><label>E-mail</label><input id="em" type="email" autocomplete="username"></div>

async function doLogin(){const {data,error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});if(error){$("#lerr").textContent=error.message;return}await afterAuth(data.session)}

async function afterAuth(session){S.user=session?.user||null;if(S.user){try{const {data}=await sb.from("mts7_membros").select("*");const m=(data||[]).find(x=>String(x.email).toLowerCase()===String(S.user.email).toLowerCase());if(m&&m.nome)S.me=m.nome}catch(e){}await load();await seedProdutos();await migrarCatalogo();await seedNotas()}go("home")}

/* ===== Home ===== */
function totais(){
  const todas=act("venda"),vendas=todas.filter(v=>!isRes(v)),compras=act("compra"),custos=act("custo");
  const adiant=sum(todas.filter(isRes),v=>sum(recsDe(v),x=>D(x).valor_brl));
  const aReceber=sum(vendas,v=>Math.max(0,vendaSaldo(v))*(D(v).cot?.[D(v).moeda]||0));
  const aPagarEur=sum(compras,c=>Math.max(0,compraSaldo(c)));
  const vendasBRL=sum(vendas,vendaBRL),comprasBRL=sum(compras,compraBRL),custosBRL=sum(custos,c=>D(c).valor_brl);
  const recebido=sum(act("recebimento"),x=>D(x).valor_brl),pago=sum(act("pagamento"),x=>D(x).valor_brl);
  const lucro=vendasBRL-comprasBRL-custosBRL;
  return{aReceber,aPagarEur,vendasBRL,comprasBRL,custosBRL,recebido,pago,lucro,adiant,nRes:todas.length-vendas.length,caixa:recebido-pago-custosBRL,pct:vendasBRL?lucro/vendasBRL:0};
}
/* ===== v5: jornada + dashboard ===== */
const PASSOS=["Reserva","Config.","Pedido","Pago S7","Entregue","Quitado"];
function jornada(v){
  const d=D(v),cs=comprasDe(v),saldo=vendaSaldo(v),temItens=(d.itens||[]).length>0;
  const devS7=sum(cs,c=>Math.max(0,compraSaldo(c)));
  const ok=[true,temItens,cs.length>0,cs.length>0&&devS7<=0.01,!!d.entrega,temItens&&saldo<=0.01];
  let cur=ok.findIndex(x=>!x);if(cur<0)cur=PASSOS.length;
  const pend=[];
  if(!ok[1])pend.push("Definir configuração");
  if(ok[1]&&!ok[2])pend.push("Fazer pedido à Smartdive");
  if(ok[2]&&!ok[3])pend.push("Pagar Smartdive "+fmt(devS7,"EUR"));
  if(ok[1]&&!ok[4])pend.push("Entregar ao cliente");
  if(ok[1]&&!ok[5])pend.push("Receber "+fmt(Math.max(0,saldo),d.moeda));
  const agora=ok[4]?pend:pend.slice(0,1); // antes da entrega: só o próximo passo; depois: todas as pendências
  const prox=agora.length?agora.join(" · "):"Concluída ✓";
  const tipo=!pend.length?"g":(!ok[1]||!ok[2])?"y":"";
  const status=!pend.length?["concluída","ok"]:!ok[1]?["reserva",""]:ok[4]?["entregue · pendente","warn"]:["em andamento","warn"];
  return{ok,cur,prox,pend,agora,tipo,status};
}
function stepsHtml(j){const last=j.ok.lastIndexOf(true);return `<div class="steps">${PASSOS.map((p,i)=>{const pul=!j.ok[i]&&i<last;return `<div class="st ${j.ok[i]?"done":""} ${pul?"pul":""} ${i===j.cur&&!pul?"cur":""}"><i></i>${p}</div>`}).join("")}</div>`}
const ini=n=>String(n||"?").replace(/\(.*?\)/g,"").trim().split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase();
function jrowHtml(v){const d=D(v),c=byId(d.cliente_id),j=jornada(v),s=vendaSaldo(v);
  return `<button class="jrow" onclick="go('venda','${v.id}')">
   <div class="jc"><div class="av">${esc(ini(D(c).nome))}</div><div style="min-width:0"><div class="nm">${esc(D(c).nome||"—")}</div><div class="cd">${(d.anexos||[]).length?"📎"+(d.anexos||[]).length+" · ":""}${esc(D(c).numero||"")} · ${esc(d.numero)} · ${(d.itens||[]).length?fmt(vendaTotal(v),d.moeda):"sem itens"}</div></div></div>
   ${stepsHtml(j)}
   <div class="jmeta"><span>Próximo: <b>${esc(j.prox)}</b></span><span>${d.entrega?"📍 "+esc(d.entrega.local||"entregue")+" · "+dCurta(d.entrega.data):isRes(v)?"adiantou "+fmt(vendaRecebido(v),d.moeda):s>0.01?"saldo "+fmt(s,d.moeda):""}</span></div>
   <div class="jst">${st(j.status[0],j.status[1])}</div></button>`}
const JF={todos:"Todos",reserva:"Reserva",pedido:"Em andamento",entrega:"A entregar",receber:"A receber",ok:"Concluídas"};
function jfilter(v,f){const j=jornada(v);switch(f){case"reserva":return !j.ok[1];case"pedido":return j.ok[1]&&!j.ok[4];case"entrega":return j.ok[1]&&!j.ok[4];case"receber":return j.ok[1]&&!j.ok[5]&&vendaSaldo(v)>0.01;case"ok":return !j.pend.length;default:return true}}
function jornadaPanel(full){
  const all=act("venda");const f=S.jf||"todos",q=(S.q||"").toLowerCase();
  let vs=all.filter(v=>jfilter(v,f));
  if(q)vs=vs.filter(v=>(D(byId(D(v).cliente_id)).nome+" "+D(v).numero+" "+D(byId(D(v).cliente_id)).numero).toLowerCase().includes(q));
  vs.sort((a,b)=>jornada(a).cur-jornada(b).cur||String(b.data).localeCompare(a.data));
  const cnt=k=>all.filter(v=>jfilter(v,k)).length;
  return `<div class="panel"><div class="ph"><h3>🧭 Jornada dos clientes</h3><button class="btn" style="min-height:38px;padding:8px 16px;font-size:13px" onclick="go('form:venda')">+ Nova venda</button></div>
   <div class="fpills">${Object.entries(JF).filter(([k])=>k!=="entrega").map(([k,l])=>`<button class="fpill ${f===k?"on":""}" onclick="S.jf='${k}';render()">${l} ${cnt(k)}</button>`).join("")}</div>
   <div id="jlist">${vs.length?(full?vs:vs.slice(0,8)).map(jrowHtml).join(""):'<div class="empty">Nenhum cliente nesta etapa.</div>'}</div>
   ${!full&&vs.length>8?`<div style="text-align:center;margin-top:8px"><button class="chip" onclick="go('jornada')">Ver todos (${vs.length})</button></div>`:""}</div>`;
}
function proximasAcoes(){
  const a=[];
  act("venda").forEach(v=>{const j=jornada(v),n=D(byId(D(v).cliente_id)).nome;j.agora.forEach((p,k)=>a.push({t:`${p} · <b>${esc(n)}</b>`,c:/configura|pedido/i.test(p)?"y":"",go:`go('venda','${v.id}')`,o:j.cur+k/10}))});
  SOCIOS.forEach(n=>{const l=socioLiq(n);if(l<-0.01)a.push({t:`Reembolsar <b>${n}</b> ${fmt(-l)}`,c:"y",go:`go('socio','${n}')`,o:9})});
  return a.sort((x,y)=>x.o-y.o);
}
function socioLiq(n){const colocou=sum(act("pagamento").filter(p=>D(p).pago_por===n),p=>D(p).valor_brl)+sum(act("custo").filter(c=>D(c).pago_por===n),c=>D(c).valor_brl);const recebeu=sum(act("recebimento").filter(x=>D(x).recebido_por===n),x=>D(x).valor_brl);return recebeu-colocou}

/* ===== Form helpers ===== */
const pills=(name,opts,val)=>`<div class="pills" data-name="${name}">${opts.map(o=>`<button type="button" class="pill ${o===val?"on":""}" onclick="pick('${name}','${esc(o)}')">${esc(o)}</button>`).join("")}</div>`;
function pick(name,val){F[name]=val;document.querySelectorAll(`.pills[data-name="${name}"] .pill`).forEach(b=>b.classList.toggle("on",b.textContent===val));F.onPick&&F.onPick(name)}
const dateField=(lbl="Data")=>`<div class="f"><label>${lbl}</label><input type="date" id="fdata" value="${F.data}" onchange="onDate(this.value)" onclick="try{this.showPicker()}catch(e){}"><div class="hint" id="fdatal">→ ${dLonga(F.data)}</div></div>`;
async function onDate(v){F.data=v||today();$("#fdatal").textContent="→ "+dLonga(F.data);if(F.usesCot){F.cot=null;updCot();const c=await fetchCot(F.data);if(c&&!(F.cot&&F.cot.manual)){F.cot={...c}}updCot()}}
async function initCot(){if(!F.usesCot)return;if(!F.cot){updCot();const c=await fetchCot(F.data);if(c&&!F.cot)F.cot={...c};}updCot()}
function updCot(){const e=$("#fcot");if(e)e.innerHTML=`<span id="fcott">${cotTxt(F.cot)}</span>`+`<br><button type="button" class="linkbtn" onclick="toggleManual()">ajustar taxa</button><div id="fman" ${F.showMan?"":"hidden"}><div class="row2" style="margin-top:6px"><div><label class="small mut">€ 1 = R$</label><input inputmode="decimal" id="mEUR" value="${F.cot?fmtN(F.cot.EUR,4):""}" oninput="manCot()"></div><div><label class="small mut">US$ 1 = R$</label><input inputmode="decimal" id="mUSD" value="${F.cot?fmtN(F.cot.USD,4):""}" oninput="manCot()"></div></div></div>`;F.onCot&&F.onCot()}
function toggleManual(){F.showMan=!F.showMan;$("#fman").hidden=!F.showMan}
function manCot(){F.cot={EUR:num($("#mEUR").value),USD:num($("#mUSD").value),BRL:1,manual:true,fonte:F.cot?.fonte};const t=$("#fcott");if(t)t.innerHTML=cotTxt(F.cot);F.onCot&&F.onCot()}
const cotBox=()=>`<div class="cot" id="fcot"></div>`;
function formActions(tipo,id){
  return `${ANX_TIPOS.includes(tipo)?anexosForm():""}<div class="err" id="ferr"></div><div class="actions">
   <button class="btn" id="fsave" onclick="FORMS.${tipo}.save()">Salvar</button>
   <button class="btn ghost" onclick="history_back()">Fechar</button>
   ${id?`<button class="btn danger" id="fcancel" onclick="armCancel('${id}')">Cancelar lançamento</button>`:""}</div>`;
}
function history_back(){go(F?.back||"home",F?.backParam)}
function armCancel(id){const b=$("#fcancel");if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Toque de novo para cancelar";setTimeout(()=>{if(b){b.classList.remove("armed");b.textContent="Cancelar lançamento"}},3500);return}
  setStatus(id,"cancelado").then(()=>{toast("Lançamento cancelado");history_back()})}
function ferr(t){$("#ferr").textContent=t;$("#fsave").disabled=false}
async function doSave(tipo,data,dados,id,after){
  $("#fsave").disabled=true;
  if(id&&dados.anexos===undefined&&D(byId(id)).anexos)dados.anexos=D(byId(id)).anexos;
  const files=F?.files||[];
  try{const nid=await saveRow(tipo,data,dados,id);await load();
    if(files.length){$("#fsave").textContent="Enviando arquivos…";try{await uploadAnexos(nid,files)}catch(e){toast("Salvo, mas o anexo falhou: "+e.message)}}toast("Salvo ✓");after?after(nid):history_back()}
  catch(e){ferr("Erro ao salvar: "+(e.message||e))}
}
function moneyFields(){
  return `<div class="f"><label>Moeda</label>${pills("moeda",MOEDAS,F.moeda)}</div>
  <div class="f"><label>Valor</label><input inputmode="decimal" id="fval" value="${fmtIn(F.valor)}" placeholder="0,00" oninput="F.valor=num(this.value);F.onCot&&F.onCot()"></div>${cotBox()}`;
}

/* ===== Itens (compra e venda) ===== */
function itemsHtml(){
  const isV=F.kind==="venda",m=isV?F.moeda:"EUR";
  const prods=act("produto");
  return F.itens.map((it,i)=>`<div class="it">
    <button class="rm" onclick="rmItem(${i})">remover</button>
    <select onchange="setProd(${i},this.value)"><option value="">Escolha o produto…</option><option value="__txt" ${it.livre?"selected":""}>✏️ Outro produto (digitar)</option>
      ${["Conjunto CCR","Peça"].map(g=>`<optgroup label="${g}">${prodsOrd().filter(p=>D(p).tipo===g).map(p=>`<option value="${p.id}" ${p.id===it.produto_id?"selected":""}>${pCod(p)?esc(pCod(p))+" · ":""}${esc(D(p).nome)}</option>`).join("")}</optgroup>`).join("")}
    </select>
    ${it.livre?`<input placeholder="Nome do produto" style="margin-top:8px" value="${esc(it.nome||"")}" oninput="F.itens[${i}].nome=this.value">`:""}
    <div class="g ${isV?"v":""}">
      <div><label class="small mut">Qtd</label><input inputmode="decimal" value="${fmtIn(it.qtd)||""}" oninput="setIt(${i},'qtd',this.value)"></div>
      <div><label class="small mut">Preço unit. (${SYM[m]})</label><input inputmode="decimal" value="${fmtIn(it.preco)}" oninput="setIt(${i},'preco',this.value)"></div>
      ${isV?`<div><label class="small mut">Desc. %</label><input inputmode="decimal" value="${it.desc?fmtN(it.desc,1):""}" oninput="setIt(${i},'desc',this.value)"></div>`:`<div></div>`}
    </div>
    <div class="sub" id="isub${i}">${itemSub(it,m)}</div></div>`).join("")+`<button class="chip" onclick="addItem()">+ Item</button>`;
}
function itemSub(it,m){const p=byId(it.produto_id);let s=fmt(itemTot(it),m);if(F.kind==="venda"&&p){s=`Tabela ${fmt(D(p).varejo,"EUR")} · `+s}return s}
function refreshItems(){$("#fitems").innerHTML=itemsHtml();updTotal()}
function addItem(){F.itens.push({produto_id:"",qtd:1,preco:0,desc:0,auto:true});refreshItems()}
function rmItem(i){F.itens.splice(i,1);refreshItems()}
function setProd(i,id){const it=F.itens[i];if(id==="__txt"){it.produto_id="";it.livre=true;it.auto=false}else{it.produto_id=id;it.livre=false;it.nome="";it.auto=true;autoPrice(it)}refreshItems()}
function autoPrice(it){const p=byId(it.produto_id);if(!p)return;
  if(F.kind==="compra")it.preco=num(D(p).dealer);
  else{const eur=num(D(p).varejo);it.preco=F.moeda==="EUR"?eur:(cotOk(F.cot)?r2(conv(eur,"EUR",F.moeda,F.cot)):0)}}
function setIt(i,k,v){const it=F.itens[i];it[k]=num(v);if(k==="preco")it.auto=false;const m=F.kind==="venda"?F.moeda:"EUR";$("#isub"+i).textContent=itemSub(it,m);updTotal()}
function updTotal(){F.updTotal&&F.updTotal()}

/* ===== FORMS ===== */
const FORMS={};
function editRow(){const id=S.param&&typeof S.param==="string"?S.param:(S.param?.id);return id?byId(id):null}

/* Compra */
FORMS.compra={
  html(){const r=editRow();const d=D(r);
    F={kind:"compra",id:r?.id,data:r?.data||today(),fornecedor:d.fornecedor||"Smartdive",doc:d.doc||"",itens:(d.itens||[{produto_id:"",qtd:1,preco:0}]).map(x=>({...x,livre:!x.produto_id&&!!x.nome})),frete:d.frete||0,iva:d.iva||0,venda_id:d.venda_id||"",obs:d.obs||"",cot:d.cot||null,usesCot:true,back:r?"compra":"home",backParam:r?.id};
    F.updTotal=()=>{const t=compraTotal({dados:F});$("#ftot").textContent=fmt(t,"EUR");$("#ftotb").textContent=cotOk(F.cot)?"≈ "+fmt(t*F.cot.EUR):""};
    F.onCot=F.updTotal;

    <div class="sec"><b>Itens</b><i></i><small>preço dealer em €</small></div>
    <div class="items" id="fitems">${itemsHtml()}</div>
    <div class="row2"><div class="f"><label>Frete (€)</label><input inputmode="decimal" value="${fmtIn(F.frete)}" oninput="F.frete=num(this.value);updTotal()"></div>
    <div class="f"><label>IVA (€)</label><input inputmode="decimal" value="${fmtIn(F.iva)}" oninput="F.iva=num(this.value);updTotal()"></div></div>
    <div class="total"><span class="mut">Total da compra</span><span class="right"><b id="ftot"></b><div class="small mut" id="ftotb"></div></span></div>
    ${cotBox()}
    <div class="f"><label>Para qual venda? (opcional)</label><select id="fvenda"><option value="">— Estoque / ainda sem venda —</option>${vendas.map(v=>`<option value="${v.id}" ${v.id===F.venda_id?"selected":""}>${esc(D(v).numero)} · ${esc(cliNome(D(v).cliente_id))}</option>`).join("")}</select></div>
    <div class="f"><label>Observação</label><textarea id="fobs">${esc(F.obs)}</textarea></div>
    ${formActions("compra",r?.id)}`},

  save(){const it=F.itens.filter(x=>x.produto_id||(x.nome||"").trim());if(!it.length)return ferr("Adicione pelo menos um item.");
    const r=editRow();
    const dados={numero:D(r).numero||nextNum("compra","P"),fornecedor:$("#ffor").value.trim(),doc:$("#fdoc").value.trim(),itens:it.map(({produto_id,nome,qtd,preco})=>({produto_id,nome:produto_id?"":(nome||"").trim(),qtd,preco})),frete:F.frete,iva:F.iva,venda_id:$("#fvenda").value,obs:$("#fobs").value.trim(),cot:F.cot,moeda:"EUR"};
    dados.total=r2(compraTotal({dados}));
    doSave("compra",F.data,dados,F.id,id=>go("compra",id));}
};

/* Pagamento */
FORMS.pagamento={
  html(){const r=editRow();const d=D(r);const pre=S.param?.compra_id;
    if(r&&d.par_id){F={kind:"pag",id:r.id,back:"compra",backParam:d.compra_id};const rc=byId(d.par_id);
      return `${backTo("compras")}<div class="lbl">Pagamento S7</div><h2>💶 Pago pelo cliente direto à Smartdive</h2>
      <div class="card"><dl class="kv"><dt>Valor</dt><dd>${fmt(d.valor,d.moeda)}</dd><dt>Abate da compra</dt><dd>${fmt(d.valor_eur,"EUR")}</dd><dt>Data</dt><dd>${dCurta(r.data)}</dd><dt>Forma</dt><dd>${esc(d.forma||"")}</dd></dl>
      <div class="hint">Este pagamento foi criado junto com o recebimento ${esc(D(byId(D(rc).venda_id)).numero||"")} (${esc(cliNome(D(byId(D(rc).venda_id)).cliente_id))}). Para editar ou cancelar, abra o recebimento: os dois andam juntos.</div></div>
      <div class="actions"><button class="btn" onclick="go('form:recebimento','${d.par_id}')">Abrir recebimento</button><button class="btn ghost" onclick="history_back()">Fechar</button></div>`}
    const compras=act("compra");
    F={kind:"pag",id:r?.id,data:r?.data||today(),compra_id:d.compra_id||pre||(compras.find(c=>compraSaldo(c)>0.01)?.id)||"",moeda:d.moeda||"EUR",valor:d.valor||0,cot:d.cot||null,pago_por:d.pago_por||S.me,forma:d.forma||"Wire",obs:d.obs||"",usesCot:true};
    F.back=pre||d.compra_id?"compra":"home";F.backParam=pre||d.compra_id;
    F.onCot=()=>{const e=$("#fabat");if(!e)return;const c=byId($("#fcompra")?.value||F.compra_id);
      if(!cotOk(F.cot)||!F.valor){e.innerHTML="";return}

/* ===== Anexos (Supabase Storage) ===== */
const BUCKET="mts7-anexos";
const ANX_TIPOS=["compra","pagamento","venda","recebimento","custo","cliente","nota"];
const ACCEPT="image/*,application/pdf,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.heic,.zip";
const fsize=b=>b>1048576?fmtN(b/1048576,1)+" MB":Math.max(1,Math.round((b||0)/1024))+" KB";
const ficon=n=>/\.pdf$/i.test(n)?"📄":/\.(png|jpe?g|heic|webp|gif)$/i.test(n)?"🖼️":"📎";
function anexosList(r){const a=D(r).anexos||[];return a.map((x,i)=>`<div class="anx"><button type="button" class="anxo" onclick="abrirAnexo('${esc(x.path)}')"><span>${ficon(x.nome)} ${esc(x.nome)}</span><small>${fsize(x.tamanho)} · ${esc(x.por||"")} · ${dCurta(x.em)} · abrir</small></button><button type="button" class="linkbtn" onclick="remAnexo('${r.id}',${i},this)">remover</button></div>`).join("")}
function anexosForm(){const r=F.id?byId(F.id):null;
  return `<div class="sec"><b>📎 Anexos</b><i></i><small>invoice, recibo, comprovante…</small></div>
  <div id="fanx">${r?anexosList(r):""}</div>
  <label class="filebtn">＋ Anexar arquivo<input type="file" multiple accept="${ACCEPT}" onchange="queueFiles(this)" hidden></label>
  <div id="fqueue" class="small mut" style="margin-top:6px;line-height:1.7"></div>`}
function queueFiles(inp){F.files=[...(F.files||[]),...inp.files];inp.value="";$("#fqueue").innerHTML=F.files.map(f=>`${ficon(f.name)} ${esc(f.name)} · ${fsize(f.size)} <span class="dim">(vai junto ao salvar)</span>`).join("<br>")}
async function uploadAnexos(id,files){
  const r=byId(id);const lista=[...(D(r).anexos||[])];
  for(const f of files){
    if(f.size>50*1048576)throw new Error(f.name+" tem mais de 50 MB");
    const safe=f.name.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w.\-]+/g,"_");const path=`${id}/${Date.now()}-${safe}`;
    const {error}=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type||undefined,upsert:false});
    if(error)throw new Error(f.name+": "+error.message);
    lista.push({path,nome:f.name,tipo:f.type,tamanho:f.size,em:today(),por:S.me});
  }
  const {error}=await sb.from(T).update({dados:{...D(byId(id)),anexos:lista}}).eq("id",id);if(error)throw error;await load();
}
async function abrirAnexo(path){const w=window.open("","_blank");
  const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(path,3600);
  if(error||!data?.signedUrl){if(w)w.close();return toast("Não consegui abrir: "+(error?.message||"tente de novo"))}
  if(w)w.location=data.signedUrl;else location.href=data.signedUrl}
async function remAnexo(id,i,btn){
  if(!btn.dataset.arm){btn.dataset.arm="1";btn.textContent="toque de novo";setTimeout(()=>{if(btn.isConnected){delete btn.dataset.arm;btn.textContent="remover"}},3500);return}
  const r=byId(id),a=[...(D(r).anexos||[])],[x]=a.splice(i,1);
  await sb.storage.from(BUCKET).remove([x.path]);
  await sb.from(T).update({dados:{...D(r),anexos:a}}).eq("id",id);await load();toast("Anexo removido");
  if(S.view.startsWith("form")){const e=$("#fanx");if(e)e.innerHTML=anexosList(byId(id))}else render()}
function anexosDet(r){
  return `<div class="sec"><b>📎 Anexos</b><i></i><small>${(D(r).anexos||[]).length}</small></div><div class="card">${anexosList(r)||'<div class="empty" style="padding:4px 0 10px">Nenhum arquivo. Anexe invoice, recibo, comprovante, foto…</div>'}
  <label class="filebtn">＋ Anexar arquivo<input type="file" multiple accept="${ACCEPT}" onchange="upDet('${r.id}',this)" hidden></label><div id="dup" class="small mut" style="margin-top:6px"></div></div>`}
async function upDet(id,inp){const fs=[...inp.files];inp.value="";if(!fs.length)return;$("#dup").textContent="Enviando "+fs.length+" arquivo(s)…";
  try{await uploadAnexos(id,fs);toast("Anexado ✓");render()}catch(e){$("#dup").textContent="Erro: "+e.message+(String(e.message).includes("not found")||String(e.message).includes("policy")?" · rode o SQL de anexos no Supabase":"")}}
function viewArquivos(){
  const all=[];S.rows.filter(r=>r.status!=="cancelado").forEach(r=>(D(r).anexos||[]).forEach(x=>all.push({r,x})));

  <div class="list">${all.map(({r,x})=>`<div class="card item"><div class="l1"><button class="anxo" style="padding:0" onclick="abrirAnexo('${esc(x.path)}')"><span>${ficon(x.nome)} ${esc(x.nome)}</span></button><button class="chip" style="min-height:34px;padding:6px 12px" onclick='abrir(byId("${r.id}"))'>ver lançamento</button></div><div class="l2"><span>${TIPOS[r.tipo]} · ${esc(resumo(r))}</span><span>${fsize(x.tamanho)} · ${dCurta(x.em)}</span></div></div>`).join("")||'<div class="empty">Nenhum arquivo ainda.</div>'}</div>`;
}

function sugerir(nome){
  const n=(nome||"").toLowerCase();
  if(/s7 kit|unidade do jp/.test(n))return"a:001";
  if(/snap|mangueira|hose|bracket|adapter ap|double ender|ring|camiset|t-?shirt|sofno/.test(n))return"c";
  if(/canister|main set/.test(n))return /capa|cap/.test(n)?"split":"p:001";
  const qc=n.match(/qc ?(4|6)/);if(qc){if(/female|f[eê]mea|femea/.test(n))return qc[1]==="4"?"p:011":"p:013";if(/male|macho/.test(n))return qc[1]==="4"?"p:012":"p:014";return""}
  if(/petrel/.test(n))return"p:015";if(/c[eé]lula|cell/.test(n))return"p:008";if(/calibra/.test(n))return"p:009";
  if(/right counter|contrapulm.*dir/.test(n))return"p:003";if(/left counter|contrapulm.*esq/.test(n))return"p:004";
  if(/needle|agulha/.test(n))return"p:005";if(/orif/.test(n))return"p:010";if(/inflat|inflador/.test(n))return"p:006";if(/adapt.*3\/8/.test(n))return"p:007";if(/ak4/.test(n))return"p:016";
  return"";
}
const USO={estoque:"Estoque (revenda)",ativo:"Ativo da empresa",consumo:"Consumo / uso próprio"};

function resolveP(code){return byCod(code)||byId(code)}
function aplicaMapa(itens,i,val){
  const it=itens[i],base={...it,nome_orig:it.nome_orig||it.nome};
  if(val==="c"){itens[i]={...base,uso:"consumo"};return true}
  if(val==="split"){const kit=byCod("001"),cal=byCod("009");if(!kit||!cal)return false;const pc=num(D(cal).dealer);
    itens.splice(i,1,{...base,produto_id:kit.id,nome:"",uso:"estoque",preco:r2(num(it.preco)-pc)},{produto_id:cal.id,nome:"",nome_orig:base.nome_orig,qtd:it.qtd,preco:pc,desc:it.desc||0,uso:"estoque"});return true}
  const [k,code]=val.split(":");const p=resolveP(code);if(!p)return false;
  itens[i]={...base,produto_id:p.id,nome:"",uso:k==="a"?"ativo":"estoque"};return true;
}
async function salvarMapa(rid,i,val){
  if(!val)return toast("Escolha uma opção");

async function aplicarSugestoes(){

function estoqueDe(p){
  let comp=0,ativo=0,vend=0,custo=0,qc=0,res=0;
  act("compra").forEach(c=>(D(c).itens||[]).forEach(it=>{if(it.produto_id!==p.id)return;const q=num(it.qtd);if(itUso(it)==="ativo")ativo+=q;else if(itUso(it)==="estoque"){comp+=q;custo+=q*num(it.preco);qc+=q}}));
  act("venda").forEach(v=>(D(v).itens||[]).forEach(it=>{if(it.produto_id!==p.id||itUso(it)!=="estoque")return;const q=num(it.qtd);vend+=q;if(!D(v).entrega)res+=q}));
  const aj=sum(act("ajuste").filter(a=>D(a).produto_id===p.id),a=>D(a).qtd);
  const disp=comp+aj-vend;
  return{comp,ativo,vend,aj,disp,res,cm:qc?custo/qc:num(D(p).dealer)};
}

   ${cats.length?`<h4>Custos por tipo</h4><table class="pt"><tbody>${cats.map(([k,v])=>`<tr><td>${k}</td><td class="r">${fmt(v)}</td></tr>`).join("")}<tr class="tt"><td>Total</td><td class="r">${fmt(t.custosBRL)}</td></tr></tbody></table>`:""}</div>
   <div><h4>Sócios · conta com a empresa</h4><table class="pt"><thead><tr><th></th><th class="r">Gastou</th><th class="r">Recebeu</th><th class="r">Situação</th></tr></thead><tbody>
    ${soc.map(x=>`<tr><td>${x.n}</td><td class="r">${fmt(x.colocou)}</td><td class="r">${fmt(x.recebeu)}</td><td class="r">${x.liq<-0.01?"reembolsar "+fmt(-x.liq):x.liq>0.01?"está com "+fmt(x.liq):"zerado"}</td></tr>`).join("")}
    <tr class="tt"><td colspan="3">Lucro previsto por sócio (50%)</td><td class="r">${fmt(t.lucro/2)}</td></tr></tbody></table>
   <h4>Caixa</h4><table class="pt"><tbody><tr><td>Caixa da empresa</td><td class="r">${fmt(t.caixa)}</td></tr><tr><td>Adiantamentos (reservas)</td><td class="r">${fmt(t.adiant)}</td></tr></tbody></table></div>
  </div>
  <div class="pf">Valores em reais (R$). Lançamentos em aberto usam o câmbio da data do lançamento (BCE). Gerado pelo MT-S7.</div>`;
}
function imprimirRelatorio(){
  const a=$("#printArea");a.innerHTML=relatorioHtml();
  a.style.cssText="display:block;position:absolute;left:-10000px;top:0;width:190mm;font-size:10px";
  const alvo=270*96/25.4; // altura útil A4 (mm → px)
  const h=a.scrollHeight;a.style.cssText="";if(h>alvo)a.style.zoom=String(Math.max(.45,alvo/h));
  const img=a.querySelector("img");
  const go2=()=>window.print();
  if(img&&!img.complete)img.onload=img.onerror=go2;else setTimeout(go2,50);
}

/* recebimento pago direto à Smartdive → cria/atualiza o pagamento par */
const DIRETO="Direto à S7";
async function syncPar(recId){
  const rec=byId(recId),d=D(rec),par=d.par_id?byId(d.par_id):null;
  try{
    if(d.recebido_por===DIRETO&&d.compra_id){
      const v=byId(d.venda_id);
      const pd={compra_id:d.compra_id,moeda:d.moeda,valor:d.valor,cot:d.cot,valor_brl:d.valor_brl,valor_eur:r2(conv(d.valor,d.moeda,"EUR",d.cot)),pago_por:"Cliente (direto)",forma:d.forma,obs:`Pago por ${cliNome(D(v).cliente_id)} direto à Smartdive (venda ${D(v).numero})${d.obs?" · "+d.obs:""}`,par_id:recId,anexos:D(par).anexos};
      if(par){await saveRow("pagamento",rec.data,pd,par.id);if(par.status==="cancelado")await sb.from(T).update({status:"ativo",canceled_at:null}).eq("id",par.id)}
      else{const pid=await saveRow("pagamento",rec.data,pd);await saveRow("recebimento",rec.data,{...d,par_id:pid},recId)}
    }else if(par){
      await sb.from(T).update({status:"cancelado",canceled_at:new Date().toISOString()}).eq("id",par.id);
      await saveRow("recebimento",rec.data,{...d,par_id:""},recId);
    }
    await load();
  }catch(e){toast("Atenção: o pagamento à Smartdive não foi atualizado: "+e.message)}
}

})();
